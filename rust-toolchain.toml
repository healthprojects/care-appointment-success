# Pin the Rust toolchain for the whole repository, so `cargo build`, `cargo clippy`
# and `cargo fmt` behave the same on every machine. The minimum supported Rust
# version (MSRV, N-2) is `rust-version` in the crates' Cargo.toml files.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
