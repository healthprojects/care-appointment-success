<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <!-- The theme-picker helper adopts this link (matching the
         data-lily-theme-picker name) and swaps its href at runtime. -->
    <link
      rel="stylesheet"
      data-lily-theme-picker="theme"
      href="%sveltekit.assets%/themes/united-kingdom-national-health-service-wales-for-patients.css"
    />
    <script>
      // Apply a persisted theme before first paint, so the page never
      // flashes the default theme before the helper hydrates.
      (function () {
        try {
          var slug = localStorage.getItem('barod-theme');
          if (slug && /^[a-z0-9-]+$/.test(slug)) {
            var link = document.querySelector('link[data-lily-theme-picker="theme"]');
            if (link) link.setAttribute('href', '%sveltekit.assets%/themes/' + slug + '.css');
            document.documentElement.setAttribute('data-theme', slug);
          }
        } catch (e) {
          /* private mode etc. — the helper applies after mount */
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
